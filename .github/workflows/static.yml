<script>

const demoScript = [

{
who:'sys',
text:"Hi! Sorry we missed your call. This is Gulf Coast Roofing's automated assistant. Are you looking for a repair, replacement, inspection, or something else?"
},

{
who:'cust',
text:"My roof is leaking."
},

{
who:'sys',
text:"I can help get your info to the team right away. Is the leak currently active?"
},

{
who:'cust',
text:"Yes, it's dripping into the hallway."
},

{
who:'sys',
text:"Got it — that's urgent. What's the property address?"
},

{
who:'cust',
text:"214 Magnolia St."
},

{
who:'sys',
text:"Thanks! I can get a crew out tomorrow morning. Does 9 AM work?"
},

{
who:'cust',
text:"9 AM works, thank you!"
},

{
who:'card',
title:'NEW ROOFING LEAD — NOTIFIED',
text:"Name: J. Alvarez\nAddress: 214 Magnolia St\nService: Active leak repair\nUrgency: High\nStatus: Appointment booked, 9:00 AM"
}

];

const thread =
document.getElementById('thread');

const statusEl =
document.getElementById('phoneStatus');

const replayBtn =
document.getElementById('replayBtn');

let playing=false;

function bubbleEl(step){

const el =
document.createElement('div');

if(step.who==='card'){

el.className='bubble card';

el.innerHTML =
`<b>${step.title}</b>${step.text.replace(/\n/g,'<br>')}`;

}else{

el.className =
'bubble ' + step.who;

el.textContent =
step.text;

}

return el;

}

async function playDemo(){

if(playing) return;

playing=true;

thread.innerHTML='';

statusEl.textContent=
'missed call';

statusEl.classList.remove(
'recovered'
);

for(
let i=0;
i<demoScript.length;
i++
){

await new Promise(
resolve =>
setTimeout(
resolve,
i===0 ? 900 : 1250
)
);

const el =
bubbleEl(
demoScript[i]
);

thread.appendChild(el);

thread.scrollTop =
thread.scrollHeight;

if(
demoScript[i].who==='card'
){

statusEl.textContent=
'lead recovered';

statusEl.classList.add(
'recovered'
);

}

}

playing=false;

setTimeout(()=>{

if(!playing){
playDemo();
}

},4200);

}

replayBtn.addEventListener(
'click',
()=>{

playing=false;
playDemo();

}
);

window.addEventListener(
'load',
playDemo
);

const leadForm =
document.getElementById(
'leadForm'
);

const leadFormWrap =
document.getElementById(
'leadFormWrap'
);

const leadSuccess =
document.getElementById(
'leadSuccess'
);

leadForm.addEventListener(
'submit',
function(e){

e.preventDefault();

leadFormWrap.style.display=
'none';

leadSuccess.classList.add(
'show'
);

}
);

</script>

