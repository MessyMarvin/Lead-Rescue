<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Rescue AI — Stop Losing Customers When You Miss the Phone</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

:root{
  --asphalt:#14171a;
  --asphalt-2:#1c2023;
  --surface:#20252a;
  --line:#33393f;
  --paper:#e9e6df;
  --paper-dim:#a7adaf;
  --signal:#ff5a33;
  --safety:#f5b400;
  --recovered:#3fb37f;
  --muted:#7c848b;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--asphalt);
  color:var(--paper);
  font-family:'Archivo',sans-serif;
  line-height:1.5;
  overflow-x:hidden;
}

::selection{
  background:var(--safety);
  color:var(--asphalt);
}

h1,h2,h3{
  font-family:'Archivo Black',sans-serif;
  text-transform:uppercase;
  letter-spacing:-0.01em;
}

a{
  color:inherit;
}

.wrap{
  max-width:1180px;
  margin:0 auto;
  padding:0 32px;
}

section{
  position:relative;
  padding:110px 0;
}

.eyebrow{
  font-family:'JetBrains Mono',monospace;
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:12px;
  color:var(--safety);
  font-weight:600;
}

.stripe{
  height:10px;
  background:repeating-linear-gradient(
    135deg,
    var(--safety) 0 18px,
    var(--asphalt) 18px 36px
  );
}

nav{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(20,23,26,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}

nav .wrap{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 32px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'Archivo Black';
  font-size:18px;
}

.logo .dot{
  width:10px;
  height:10px;
  background:var(--signal);
  border-radius:50%;
  box-shadow:0 0 0 4px rgba(255,90,51,.18);
  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  0%,100%{
    box-shadow:0 0 0 4px rgba(255,90,51,.18);
  }

  50%{
    box-shadow:0 0 0 8px rgba(255,90,51,.05);
  }
}

nav ul{
  list-style:none;
  display:flex;
  gap:34px;
  font-size:14px;
  font-weight:600;
}

nav ul a{
  text-decoration:none;
  color:var(--paper-dim);
}

nav ul a:hover{
  color:var(--safety);
}

.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--safety);
  color:var(--asphalt);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.03em;
  font-size:13px;
  padding:12px 22px;
  border-radius:3px;
  text-decoration:none;
  border:none;
  cursor:pointer;
  transition:.15s ease;
}

.btn:hover{
  transform:translateY(-2px);
  background:#ffc934;
}

.btn-ghost{
  background:transparent;
  color:var(--paper);
  border:1px solid var(--line);
}

.btn-ghost:hover{
  border-color:var(--safety);
  color:var(--safety);
  background:transparent;
}

.hero{
  padding:90px 0 70px;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:64px;
  align-items:center;
}

.hero h1{
  font-size:clamp(38px,5vw,60px);
  line-height:.98;
  margin:18px 0 22px;
}

.hero h1 span{
  color:var(--safety);
}

.hero p.lede{
  font-size:18px;
  color:var(--paper-dim);
  max-width:480px;
  margin-bottom:32px;
}

.hero-ctas{
  display:flex;
  gap:14px;
  margin-bottom:36px;
  flex-wrap:wrap;
}

.hero-stats{
  display:flex;
  gap:34px;
  border-top:1px solid var(--line);
  padding-top:22px;
}

.hero-stats div b{
  font-family:'Archivo Black';
  font-size:22px;
  display:block;
  color:var(--safety);
}

.hero-stats div span{
  font-size:12px;
  color:var(--muted);
  text-transform:uppercase;
}

.phone-stage{
  position:relative;
  display:flex;
  justify-content:center;
}

.phone{
  width:320px;
  background:var(--asphalt-2);
  border:1px solid var(--line);
  border-radius:34px;
  padding:14px;
  box-shadow:0 40px 80px -20px rgba(0,0,0,.6);
}

.phone-notch{
  width:70px;
  height:5px;
  background:var(--line);
  border-radius:3px;
  margin:0 auto 10px;
}

.phone-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 10px 14px;
  border-bottom:1px solid var(--line);
  margin-bottom:12px;
}

.phone-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:linear-gradient(
    135deg,
    var(--safety),
    var(--signal)
  );
  flex-shrink:0;
}

.phone-head b{
  font-size:14px;
  display:block;
}

.phone-head span{
  font-size:11px;
  color:var(--muted);
}

.phone-status{
  margin-left:auto;
  font-family:'JetBrains Mono';
  font-size:10px;
  padding:3px 8px;
  border-radius:20px;
  background:rgba(255,90,51,.15);
  color:var(--signal);
  border:1px solid rgba(255,90,51,.4);
  text-transform:uppercase;
}

.phone-status.recovered{
  background:rgba(63,179,127,.15);
  color:var(--recovered);
  border-color:rgba(63,179,127,.4);
}

.thread{
  height:340px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  gap:9px;
  padding:2px 2px 4px;
}

.bubble{
  max-width:82%;
  padding:9px 13px;
  border-radius:14px;
  font-size:12.5px;
  line-height:1.4;
  opacity:0;
  transform:translateY(8px);
  animation:rise .35s ease forwards;
}

@keyframes rise{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.bubble.sys{
  align-self:flex-start;
  background:var(--surface);
  border:1px solid var(--line);
  border-bottom-left-radius:3px;
}

.bubble.cust{
  align-self:flex-end;
  background:var(--safety);
  color:var(--asphalt);
  font-weight:600;
  border-bottom-right-radius:3px;
}

.bubble.card{
  align-self:stretch;
  background:rgba(63,179,127,.1);
  border:1px solid rgba(63,179,127,.45);
  border-radius:10px;
  padding:10px 12px;
  font-family:'JetBrains Mono';
  font-size:11px;
  color:var(--recovered);
}

.bubble.card b{
  display:block;
  color:var(--paper);
  font-family:'Archivo';
  font-size:12.5px;
  margin-bottom:4px;
}

.replay{
  position:absolute;
  bottom:-18px;
  left:50%;
  transform:translateX(-50%);
  font-family:'JetBrains Mono';
  font-size:11px;
  color:var(--muted);
  background:var(--asphalt);
  padding:4px 12px;
  border:1px solid var(--line);
  border-radius:20px;
  cursor:pointer;
}

.replay:hover{
  color:var(--safety);
  border-color:var(--safety);
}

.problem .wrap{
  display:grid;
  grid-template-columns:.9fr 1.1fr;
  gap:60px;
  align-items:start;
}

.problem h2{
  font-size:clamp(28px,3.4vw,40px);
  line-height:1.05;
  margin:14px 0 20px;
}

.problem p{
  color:var(--paper-dim);
  max-width:420px;
}

.call-step{
  display:flex;
  gap:18px;
  padding:20px 0;
  border-bottom:1px solid var(--line);
}

.call-step .tag{
  font-family:'JetBrains Mono';
  font-size:11px;
  background:var(--paper-dim);
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  flex-shrink:0;
  font-weight:700;
}

.call-step.bad .tag{
  background:var(--signal);
  color:#fff;
}

.call-step.good .tag{
  background:var(--recovered);
  color:#fff;
}

.call-step h4{
  font-size:15px;
  margin-bottom:4px;
}

.call-step p{
  font-size:13.5px;
  color:var(--muted);
  margin:0;
}

.how{
  background:var(--asphalt-2);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.how-head{
  max-width:560px;
  margin-bottom:56px;
}

.how-head h2{
  font-size:clamp(28px,3.4vw,40px);
  margin:14px 0 16px;
}

.flow{
  display:flex;
  flex-wrap:wrap;
}

.flow-step{
  flex:1 1 220px;
  padding:26px 22px;
  border:1px solid var(--line);
  background:var(--surface);
}

.flow-step .n{
  font-family:'JetBrains Mono';
  font-size:12px;
  color:var(--safety);
  display:block;
  margin-bottom:10px;
}

.flow-step h4{
  font-size:14.5px;
  margin-bottom:6px;
}

.flow-step p{
  font-size:12.5px;
  color:var(--muted);
}

.pricing-head{
  text-align:center;
  max-width:600px;
  margin:0 auto 56px;
}

.pricing-head h2{
  font-size:clamp(28px,3.4vw,40px);
  margin:14px 0 16px;
}

.pricing-head p{
  color:var(--paper-dim);
}

.plans{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.plan{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:6px;
  padding:32px 26px;
  display:flex;
  flex-direction:column;
  gap:18px;
  position:relative;
}

.plan.featured{
  border-color:var(--safety);
  box-shadow:0 0 0 1px var(--safety);
}

.plan.featured::before{
  content:'MOST INSTALLED';
  position:absolute;
  top:-12px;
  left:26px;
  background:var(--safety);
  color:var(--asphalt);
  font-family:'JetBrains Mono';
  font-size:10px;
  font-weight:700;
  padding:4px 10px;
  border-radius:3px;
}

.plan .price{
  font-family:'Archivo Black';
  font-size:40px;
}

.plan .price span{
  font-family:'Archivo';
  font-size:14px;
  color:var(--muted);
}

.plan .setup{
  font-family:'JetBrains Mono';
  font-size:12px;
  color:var(--muted);
}

.plan ul{
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:10px;
  font-size:13.5px;
  color:var(--paper-dim);
}

.plan li::before{
  content:'—';
  color:var(--safety);
  margin-right:8px;
}

.plan .btn{
  margin-top:auto;
  justify-content:center;
}

.industry-cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.industry-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:6px;
  padding:28px;
  display:flex;
  flex-direction:column;
  min-height:320px;
}

.industry-card:hover{
  transform:translateY(-3px);
  border-color:var(--safety);
}

.industry-card:last-child{
  grid-column:1/-1;
  min-height:auto;
}

.industry-icon{
  font-size:27px;
  margin-bottom:18px;
}

.industry-card h3{
  font-size:18px;
  margin-bottom:12px;
}

.industry-card p{
  color:var(--paper-dim);
  font-size:13.5px;
  margin-bottom:20px;
}

.industry-example{
  margin-top:auto;
  background:var(--asphalt);
  border-left:2px solid var(--recovered);
  padding:12px 14px;
  color:var(--paper-dim);
  font-family:'JetBrains Mono';
  font-size:11px;
}

.industry-example b{
  display:block;
  color:var(--recovered);
  margin-bottom:4px;
  font-size:10px;
}

.industry-link{
  display:inline-block;
  margin-top:18px;
  color:var(--safety);
  text-decoration:none;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
}

.lead-section{
  background:var(--asphalt-2);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.lead-grid{
  display:grid;
  grid-template-columns:.85fr 1.15fr;
  gap:60px;
}

.lead-copy h2{
  font-size:clamp(28px,3.4vw,40px);
  margin:14px 0 16px;
}

.lead-copy p{
  color:var(--paper-dim);
  max-width:400px;
  margin-bottom:26px;
}

.lead-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:6px;
  padding:30px;
}

.field-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-bottom:16px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-family:'JetBrains Mono';
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
}

.field input,
.field select{
  background:var(--asphalt);
  border:1px solid var(--line);
  color:var(--paper);
  padding:11px 12px;
  border-radius:4px;
  font-family:'Archivo';
  font-size:14px;
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:var(--safety);
}

.submit-btn{
  width:100%;
  justify-content:center;
  padding:14px;
  margin-top:4px;
}

.lead-success{
  display:none;
  text-align:center;
  padding:20px 4px;
}

.lead-success.show{
  display:block;
}

.cta{
  text-align:center;
}

.cta h2{
  font-size:clamp(30px,4.4vw,52px);
  max-width:760px;
  margin:0 auto 20px;
}

.cta p{
  color:var(--paper-dim);
  max-width:480px;
  margin:0 auto 34px;
}

footer{
  border-top:1px solid var(--line);
  padding:44px 0;
}

footer .wrap{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:16px;
}

footer .foot-links{
  display:flex;
  gap:24px;
  list-style:none;
  font-size:13px;
  color:var(--muted);
}

footer a{
  text-decoration:none;
}

@media(max-width:900px){

  nav ul{
    display:none;
  }

  .hero-grid,
  .problem .wrap,
  .lead-grid{
    grid-template-columns:1fr;
  }

  .plans,
  .industry-cards{
    grid-template-columns:1fr;
  }

  .industry-card:last-child{
    grid-column:auto;
  }

  .field-row{
    grid-template-columns:1fr;
  }

  section{
    padding:70px 0;
  }
}
</style>
</head>

